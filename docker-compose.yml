services:
  api:
    build: .
    restart: always
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      - db

  db:
    build: dockerDB
    restart: always
    networks:
      - backend
    volumes:
      - JMDICT_DATA:/var/lib/mysql

volumes:
  JMDICT_DATA:

networks:
  backend:
    driver: bridge